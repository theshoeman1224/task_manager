[package]
name = "linux-task-manager"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "linux_task_manager"
path = "src/lib.rs"

[[bin]]
name = "linux-task-manager"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = []
gui = ["dep:gtk4", "dep:glib", "dep:gio"]

[dependencies]
gio = { version = "0.19", optional = true }
glib = { version = "0.19", optional = true }
gtk4 = { version = "0.8", optional = true }
